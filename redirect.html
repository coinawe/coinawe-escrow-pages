<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mengarahkan ke Explorer...</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      background: #f9fafb;
    }
    .box {
      display: inline-block;
      background: white;
      padding: 20px 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .loader {
      margin: 20px auto;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #4cafef;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    a {
      display: inline-block;
      margin-top: 15px;
      text-decoration: none;
      color: #4cafef;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>🔗 Mengarahkan ke Explorer</h2>
    <p>Silakan tunggu sebentar...</p>
    <div class="loader"></div>
    <p><a id="manualLink" href="#">Klik di sini jika tidak diarahkan otomatis</a></p>
  </div>

  <script>
    // Ambil parameter dari URL
    const urlParams = new URLSearchParams(window.location.search);
    const tx = urlParams.get('tx');
    const currency = (urlParams.get('currency') || '').toUpperCase();

    // Tentukan tujuan
    let targetUrl = "https://escrow.coinawe.site"; // fallback
    if (currency === "TON") {
      targetUrl = `https://tonscan.org/tx/${tx}`;
    } else if (currency === "AWEWE") {
      targetUrl = `https://explorer.coinawe.site/tx/${tx}`;
    }

    // Update link manual
    document.getElementById("manualLink").href = targetUrl;

    // Redirect otomatis setelah 1 detik
    setTimeout(() => {
      window.location.href = targetUrl;
    }, 1000);
  </script>
</body>
</html>
